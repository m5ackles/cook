plugins {
    id 'com.android.application'
}

android {
    namespace 'com.worldfood.conquest'
    compileSdk 34

    defaultConfig {
        applicationId "com.worldfood.conquest"
        minSdk 26
        targetSdk 34
        // 새 APK를 올릴 때마다 versionCode를 1씩 올리면 기존 앱 위에 바로 업데이트됨
        versionCode 23
        versionName "2.3"
    }

    // 항상 같은 열쇠로 서명 → 지우지 않고 덮어 설치 가능 (저장 데이터 유지)
    signingConfigs {
        fixed {
            storeFile file('worldfood.keystore')
            storePassword 'worldfood'
            keyAlias 'worldfood'
            keyPassword 'worldfood'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        noCompress += ['mp3', 'png']
    }
}
