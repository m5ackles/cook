<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>세계 음식 정복 — 프로토타입 2판</title>
<style>
:root{--bg:#0d1322;--panel:#171f36;--panel2:#202a48;--line:#2c3860;--ink:#f3f5fb;--mute:#97a3c2;--gold:#ffc94a;--red:#e2474b;--blue:#3c82ff;--warn:#ff9f1c;--good:#34c27a;--outer:#080c16;--map1:#14244a;--map2:#0b1226;--sec:#1b1530;--secl:#3a2c63;--nav:#0f1528;
--g0:#9aa0ad;--g1:#2fae62;--g2:#3a7bf2;--g3:#8a4ff0;--g4:#e2394b;--g5:#ff9a1f}
body[data-theme="wine"]{--bg:#1a1014;--panel:#24161c;--panel2:#331f28;--line:#4a2e3a;--ink:#f6eef1;--mute:#b79aa6;--outer:#0f090c;--map1:#3a1a2a;--map2:#1a0c14;--sec:#2a1424;--secl:#5a2c48;--nav:#170d12}
body[data-theme="forest"]{--bg:#0f1714;--panel:#16221d;--panel2:#1f2f28;--line:#2c443a;--ink:#eef6f1;--mute:#93ad9f;--outer:#08100c;--map1:#163a2c;--map2:#0a1a14;--sec:#14241e;--secl:#2c4a3c;--nav:#0c1511}
body[data-theme="soft"]{--bg:#2a2f3a;--panel:#343a47;--panel2:#3f4655;--line:#4f5768;--ink:#f1f3f7;--mute:#b4bccb;--outer:#22262f;--map1:#3b4b6b;--map2:#2a3245;--sec:#3a3550;--secl:#5a5378;--nav:#2c313c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--outer);color:var(--ink);font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
input{font:inherit}
#app{display:flex;flex-direction:column;height:100%;max-width:960px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;overflow:clip}
#app.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 상단 */
#top{display:flex;align-items:center;gap:6px;padding:7px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.chip{background:var(--panel2);border-radius:999px;padding:5px 9px;font-weight:700;font-size:13.5px;white-space:nowrap}
#lvl{color:#bcd0ff}#coins{color:var(--gold)}
#clock{font-size:12px;color:var(--mute);font-weight:700}
#clock.rush{color:#ffb347}
#susWrap{flex:1;min-width:60px}
#susLbl{font-size:11px;color:var(--mute);display:flex;justify-content:space-between}
#susBar{height:7px;background:#2a3355;border-radius:6px;overflow:hidden;margin-top:2px}
#susFill{height:100%;width:0;background:linear-gradient(90deg,#ffd34a,#ff6a3d,#e2264b);transition:width .3s}
.tb{background:var(--panel2);border-radius:8px;padding:5px 7px;font-size:13px;font-weight:700}
#lvBar{height:3px;background:#1b2340}#lvFill{height:100%;width:0;background:#7fa6ff;transition:width .3s}
#ticker{background:rgba(0,0,0,.25);border-bottom:1px solid var(--line);font-size:13px;height:26px;overflow:hidden;position:relative;white-space:nowrap}
#tickTxt{position:absolute;left:100%;top:4px;animation:tick 14s linear infinite;color:#ffd98a}
@keyframes tick{to{transform:translateX(-200%)}}
#ticker.alarm #tickTxt{color:#ff7a7a}

/* 지도 */
#mapWrap{flex:1;position:relative;min-height:0;overflow:hidden;background:radial-gradient(ellipse at center,var(--map1) 0%,var(--map2) 70%)}
#mapBox{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}
#mapBox.drag{cursor:grabbing}
#map{display:block;width:100%;height:100%}
#map .reg{cursor:pointer;transition:fill .4s;stroke:var(--bg);stroke-width:.6;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#map .reg path{vector-effect:non-scaling-stroke}
#map .reg:hover{filter:brightness(1.15)}
#map .reg.sel{stroke:#ffe27a;stroke-width:2}
#zoomBtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
#zoomBtns button{width:34px;height:34px;border-radius:9px;background:rgba(23,31,54,.85);border:1px solid var(--line);font-size:18px;font-weight:800}
.bubble{cursor:pointer}.bubble circle{fill:var(--gold);stroke:#fff6c8;stroke-width:2;animation:pop .35s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
#worldPct{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--mute);background:rgba(0,0,0,.45);padding:4px 8px;border-radius:8px}
#worldPct b{color:#8fb4ff;font-size:15px}
#mapHint{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--mute);background:rgba(0,0,0,.45);padding:4px 8px;border-radius:8px}
.float{position:absolute;pointer-events:none;font-weight:800;font-size:18px;text-shadow:0 2px 4px #000;animation:floatUp 1.1s ease-out forwards;white-space:nowrap;z-index:45}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-50px)}}
#rushBanner{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:4;display:none}
#rushBanner button{background:linear-gradient(180deg,#ffb347,#ff7a1a);color:#2a1300;font-weight:900;border-radius:999px;padding:7px 14px;font-size:13.5px;animation:pulse 1.4s infinite;box-shadow:0 4px 14px #0008}

/* 비서·지역 줄 */
#sec{display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--sec);border-top:1px solid var(--secl)}
#sec .art{width:40px;height:40px;border-radius:50%;flex:none}
#secTxt{flex:1;font-size:13.5px;line-height:1.35}
#secTxt small{color:#c7b6ff;font-weight:700;display:block;font-size:11px}
#secGo{background:linear-gradient(180deg,#9b7bff,#6c48f0);border-radius:10px;padding:9px 13px;font-weight:800;font-size:14px;flex:none;animation:pulse 1.6s infinite}
#secGo[hidden]{display:none}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(155,123,255,.25)}}
#strip{padding:8px 10px;background:var(--panel);border-top:1px solid var(--line);font-size:13px;min-height:58px}
#strip .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#strip .nm{font-weight:800;font-size:15px}
#strip .bar{flex:1;min-width:70px;height:8px;border-radius:5px;background:var(--red);overflow:hidden}
#strip .bar i{display:block;height:100%;background:var(--blue)}
#strip .meta{color:var(--mute);font-size:12px;margin-top:4px}
.qb{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12.5px;font-weight:700}
.qb:active{transform:scale(.96)}
.qb.hot{border-color:var(--gold);color:var(--gold)}
.qb:disabled{opacity:.45}

/* 시간 진행 버튼 */
#adv{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);border-top:1px solid var(--line);position:relative;z-index:25}
#adv span{font-size:12.5px;font-weight:800;color:var(--mute);min-width:74px}
#adv button{flex:1;background:linear-gradient(180deg,#4a8cff,#2c63e0);border:1px solid #6aa0ff;border-radius:10px;padding:8px 4px;font-weight:900;font-size:13.5px}
#adv button:nth-of-type(3){background:var(--panel2);border-color:var(--line)}
#adv button:disabled{opacity:.4}
#adv.busy button{opacity:.6;pointer-events:none}
/* 하단 탭 */
#nav{display:flex;background:var(--nav);position:relative;z-index:25;border-top:1px solid var(--line)}
#nav button{flex:1;min-width:0;padding:7px 0 9px;background:none;font-size:11px;letter-spacing:-.3px;font-weight:700;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
#nav button span{font-size:21px}
#nav button.on{color:var(--ink);background:var(--panel2)}
#nav button i.dot{position:absolute;top:5px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:#ff4d5e;display:none}
#nav button.alert i.dot{display:block}

/* 페이지 */
#page{flex:1;min-height:0;overflow:auto;display:none;padding:12px;padding-bottom:24px}
body.paged #page{display:block}
body.paged #mapWrap,body.paged #sec,body.paged #strip{display:none}
.ph1{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.ph1 h2{margin:0;font-size:19px}
.ph1 small{color:var(--mute);font-size:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.box h3{margin:0 0 8px;font-size:15px}
.mute{color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:800;font-size:13.5px}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,#4a8cff,#2c63e0);border-color:#6aa0ff}
.btn.gold{background:linear-gradient(180deg,#ffcf5a,#e9a400);color:#2a1d00;border-color:#ffd97a}
.btn.red{background:linear-gradient(180deg,#ff6b6b,#d6334a);border-color:#ff8a8a}
.btn.pur{background:linear-gradient(180deg,#9b7bff,#6c48f0);border-color:#b39bff}
.btn:disabled{opacity:.45;transform:none}
.pbar{height:8px;border-radius:5px;background:#2a3355;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--good)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:800;color:#fff;white-space:nowrap}
.gr0{background:var(--g0)}.gr1{background:var(--g1)}.gr2{background:var(--g2)}.gr3{background:var(--g3)}.gr4{background:var(--g4)}.gr5{background:linear-gradient(90deg,#ff8a00,#ffd000);color:#2a1700}
.seg{display:flex;gap:4px;background:var(--panel2);border-radius:10px;padding:3px;margin-bottom:10px;overflow-x:auto}
.seg button{flex:1;background:none;border-radius:8px;padding:7px 8px;font-size:12.5px;font-weight:800;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--bg);color:var(--ink)}
.list .it{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px;margin-bottom:7px}
.list .it .art{width:48px;height:48px;border-radius:10px;flex:none}
.list .it b{font-size:14px}
.list .it small{display:block;color:var(--mute);font-size:12px}

/* 그림 자리 */
.art{position:relative;background:#2a3560;display:flex;align-items:center;justify-content:center;overflow:hidden}
.art span{font-size:24px;line-height:1}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art svg{display:block}

/* 공작 시트 */
#sheet{position:absolute;left:0;right:0;bottom:60px;max-height:64%;background:var(--panel);border-top:2px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(130%);visibility:hidden;transition:transform .25s,visibility .25s;z-index:20;box-shadow:0 -8px 24px #0008;display:flex;flex-direction:column}
#sheet.open{transform:none;visibility:visible}
#sheetHead{padding:10px 12px 0;border-bottom:1px solid var(--line)}
#sheetHead .r1{display:flex;align-items:center;justify-content:space-between}
#sheetHead b{font-size:16px}
#sheetHead small{color:var(--mute);font-size:12px;display:block}
#sheetX{background:var(--panel2);border-radius:8px;padding:6px 12px;font-weight:700}
#sheetTabs{margin:8px 0 8px}
#sheetBody{overflow:auto;padding:10px;padding-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:5px;position:relative;min-height:124px}
.card:active{transform:scale(.97)}
.card .top{display:flex;gap:8px;align-items:center}
.card .art{width:40px;height:40px;border-radius:9px;flex:none}
.card .nm{font-weight:800;font-size:13.5px;line-height:1.2}
.card .d{font-size:11.5px;color:var(--mute);line-height:1.35;flex:1}
.card .ft{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}
.cost{color:var(--gold)}
.sus{border-radius:6px;padding:1px 6px;font-size:11px}
.sus.s0{background:#23413a;color:#7ee2b0}.sus.s1{background:#4a3a1a;color:#ffc56a}.sus.s2{background:#4d1f2a;color:#ff8a9a}.sus.sm{background:#1f3a52;color:#8fd0ff}
.card.poor{opacity:.55}.card.lock{opacity:.4}
.card.lock::after{content:attr(data-lock);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;background:rgba(8,12,22,.55);border-radius:12px}
.card.max{opacity:.45}
.sec{font-size:12px;color:var(--mute);font-weight:700;margin:12px 2px 6px}
.modes{display:flex;gap:6px}
.modes button{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 4px;font-size:12.5px;font-weight:700;line-height:1.3}
.modes button.on{border-color:var(--gold);background:#3a3218}
.modes button small{display:block;font-weight:500;color:var(--mute);font-size:10.5px}
.rv{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:6px}
.rv .art{width:40px;height:40px;border-radius:50%;flex:none}
.rv .info{flex:1;font-size:12px;color:var(--mute)}
.rv .info b{color:var(--ink);font-size:13.5px}
.mini{height:5px;border-radius:4px;background:#2a3355;margin:3px 0;overflow:hidden}.mini i{display:block;height:100%}
.rv.gone{opacity:.5}

/* 카드 인벤토리 */
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.gc{position:relative;border-radius:12px;padding:6px;background:var(--panel2);border:2px solid var(--g0);text-align:center;font-size:11.5px;line-height:1.25}
.gc .art{width:100%;aspect-ratio:3/4;border-radius:8px;margin-bottom:4px}
.gc .art span{font-size:34px}
.gc b{display:block;font-size:12px}
.gc .lv{position:absolute;top:8px;right:8px;background:#000a;border-radius:6px;padding:0 5px;font-weight:900;font-size:11px;color:#ffd34a}
.gc .eq{position:absolute;top:8px;left:8px;background:#000a;border-radius:6px;padding:0 5px;font-size:11px}
.gc.g1{border-color:var(--g1)}.gc.g2{border-color:var(--g2)}.gc.g3{border-color:var(--g3);box-shadow:0 0 10px #8a4ff066}.gc.g4{border-color:var(--g4);box-shadow:0 0 12px #e2394b77}.gc.g5{border-color:#ffb000;box-shadow:0 0 16px #ffb000aa}
/* 카드 뒤집기 연출 */
#reveal{position:absolute;inset:0;z-index:58;background:rgba(5,8,16,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#reveal.on{display:flex}
#reveal .stage{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:94%}
.flip{width:118px;height:170px;perspective:600px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .bk,.flip .fr{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px}
.flip .bk{background:repeating-linear-gradient(45deg,#3a2c7a,#3a2c7a 8px,#2a1f5a 8px,#2a1f5a 16px);border:3px solid #6c58c8;display:flex;align-items:center;justify-content:center;font-size:40px}
.flip .fr{transform:rotateY(180deg)}
.flip .fr .gc{height:100%}
#reveal .flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,#ffd000aa,transparent 70%);opacity:0}
#reveal.uni .flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

/* 가게·인테리어 */
.shopHead{display:flex;gap:12px;align-items:center}
.shopHead .art{width:88px;height:88px;border-radius:14px;flex:none}
.sign{background:#2a2440;border-radius:12px;padding:8px 12px;text-align:center;margin:8px 0}
.sign .tt{color:#ffcf5a;font-size:12px;font-weight:800;min-height:16px}
.sign .nm{font-size:20px;font-weight:900}
.grid{display:grid;gap:3px;background:#8a6a3a;padding:6px;border-radius:10px;touch-action:manipulation}
.grid .cl{min-height:0;background:#f3e4c9;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;overflow:hidden;cursor:pointer}
.grid .cl:nth-child(odd){background:#efdcbc}
.grid .cl.it{background:#e3c995;box-shadow:inset 0 0 0 2px #b88a4a;font-size:24px}
.grid .cl img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pal{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.pal button{flex:none;width:74px;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:5px 3px;font-size:11px;line-height:1.2}
.pal button.on{border-color:var(--gold)}
.pal button .art{width:40px;height:40px;margin:0 auto 3px;border-radius:8px;background:#3a335a}
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}
.slot{border:2px dashed var(--line);border-radius:10px;padding:6px;text-align:center;font-size:11.5px;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--panel2)}
.slot.full{border-style:solid}
.slot .e{font-size:22px}
.vip{border:2px solid #ffb347;background:linear-gradient(180deg,#3a2a10,var(--panel))}

/* 출석 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{background:var(--panel2);border-radius:9px;padding:6px 2px;text-align:center;font-size:10.5px;line-height:1.25;min-height:52px;border:1px solid var(--line)}
.cal div b{display:block;font-size:12px}
.cal div.done{opacity:.45}
.cal div.today{border:2px solid var(--gold)}
.cal div.big{background:#2f2555}
.mis .it{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}

/* 랜드마크 */
.bld{display:grid;grid-template-columns:34px repeat(10,1fr);gap:3px;align-items:stretch}
.bld .fl{font-size:11px;font-weight:900;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.bld .fl .mono{font-size:13px}
.rm{position:relative;aspect-ratio:1/1.15;border-radius:6px;background:#27304a;border:1px solid #3a4566;font-size:9.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;line-height:1.1;padding:1px}
.rm .no{position:absolute;top:1px;left:2px;font-size:8.5px;opacity:.75}
.rm .ic{font-size:15px}
.rm.s1{box-shadow:inset 0 -3px 0 #8fb0ff55}.rm.s2{box-shadow:inset 0 -3px 0 #ffd34a88}.rm.s3{box-shadow:inset 0 -3px 0 #ff7ad8aa}
.rm.me{background:#2c63e0;border-color:#8fb0ff}
.rm.me.main{background:#1d4ed8;border:2px solid #ffd34a}
.rm.me.branch{background:#3b82f6;border:2px dashed #ffd34a}
.rm.red{background:#7a2230;border-color:#c74b5c}
.rm.gold{background:#6b5216;border-color:#c9a23a}
.rm.solo{background:#3d3f52;border-color:#5f6378}
.rm.can{outline:2px dashed #34c27a;outline-offset:-2px}
.rm.sel{outline:3px solid #fff;outline-offset:-2px}
.rm.cut{animation:blink 1s infinite}
.rm.prot::after{content:'🛡';position:absolute;bottom:1px;right:2px;font-size:9px}
.rm.gob{background:radial-gradient(circle,#ffe27a55,#27304a 70%)}
.rm.auc{outline:2px solid #ff9f1c;outline-offset:-2px}
@keyframes blink{50%{opacity:.55}}
.apbar{display:flex;gap:3px}.apbar i{flex:1;height:10px;border-radius:3px;background:#2a3355}.apbar i.on{background:#9b7bff}
.log{max-height:160px;overflow:auto;font-size:12px;line-height:1.55;background:rgba(0,0,0,.25);border-radius:10px;padding:8px}
.log div{border-bottom:1px solid rgba(255,255,255,.06)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t td,table.t th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--mute);font-weight:700}

/* 모달 */
#modal{position:absolute;inset:0;background:rgba(5,8,16,.78);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.open{display:flex}
#mBox{background:var(--panel);border:2px solid var(--line);border-radius:18px;max-width:420px;width:100%;max-height:92%;overflow:auto;animation:pop .25s}
#mBox>.art{width:100%;aspect-ratio:16/9}
#mBox>.art span{font-size:64px}
#mBody{padding:14px}
#mBody h3{margin:0 0 6px;font-size:19px}
#mBody p{margin:0 0 12px;color:var(--mute);font-size:14px;line-height:1.5}
#mBody input[type=text]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:16px}
.choice{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-weight:800;font-size:14.5px}
.choice small{display:block;font-weight:500;color:var(--mute);font-size:12px;margin-top:2px}
.choice:active{transform:scale(.98)}
.choice.primary{background:linear-gradient(180deg,#4a8cff,#2c63e0);border-color:#6aa0ff}
.choice:disabled{opacity:.45}

/* 타이틀 */
#title{position:absolute;inset:0;z-index:60;background:radial-gradient(ellipse at top,#2a1d55,var(--outer) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:auto}
#title .art{width:min(300px,72vw);aspect-ratio:1;border-radius:24px;margin-bottom:14px;flex:none}
#title .art span{font-size:100px}
#title h1{margin:0;font-size:32px;letter-spacing:-1px}
#title h1 em{font-style:normal;color:#6ea2ff}
#title p{color:var(--mute);font-size:14px;line-height:1.6;margin:8px 0 14px}
#title .choice{max-width:300px;text-align:center}
.themes{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.themes button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.themes button.on{border-color:#fff}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#000d;padding:8px 14px;border-radius:10px;font-size:13.5px;font-weight:700;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>

let V={x:0,y:0,w:FW,h:FH},dragged=false;
function buildMap(){
  const svg=$('map');
  let s=`<rect x="-3000" y="-3000" width="${FW+6000}" height="${FH+6000}" fill="transparent"/>`;
  IDS.forEach(i=>{s+=`<g class="reg" id="g${i}" data-id="${i}"><path d="${MAP.r[i].d}"/></g>`});

/* ----- 이동·확대 ----- */
const boxAsp=()=>{const b=$('mapBox');return b.clientWidth/Math.max(1,b.clientHeight)};
const fitW=()=>Math.max(FW,FH*boxAsp());
function clampV(){
  const a=boxAsp();V.w=Math.min(fitW(),Math.max(fitW()/8,V.w));V.h=V.w/a;
  V.x=V.w>=FW?(FW-V.w)/2:Math.min(FW-V.w,Math.max(0,V.x));
  V.y=V.h>=FH?(FH-V.h)/2:Math.min(FH-V.h,Math.max(0,V.y));
}
function applyV(){clampV();$('map').setAttribute('viewBox',`${V.x} ${V.y} ${V.w} ${V.h}`);drawBubbles()}
function toMap(cx,cy){const r=$('mapBox').getBoundingClientRect();return [V.x+(cx-r.left)/r.width*V.w,V.y+(cy-r.top)/r.height*V.h]}
function zoomAt(cx,cy,f){const [mx,my]=toMap(cx,cy);const nw=Math.min(fitW(),Math.max(fitW()/8,V.w/f));const k=nw/V.w;V.x=mx-(mx-V.x)*k;V.y=my-(my-V.y)*k;V.w=nw;applyV()}
function zoomBtn(f){const r=$('mapBox').getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,f)}
function fitMap(){V.w=fitW();applyV()}
function focusRegion(id,zoom){
  if(!id)return;const b=MAP.r[id].bb,cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2;
  const to=zoom||V.w,from={...V},t0=performance.now();
  (function step(t){const k=Math.min(1,(t-t0)/400),e=k*(2-k);V.w=from.w+(to-from.w)*e;V.h=V.w/boxAsp();
    V.x=from.x+(cx-V.w/2-from.x)*e;V.y=from.y+(cy-V.h/2-from.y)*e;applyV();if(k<1)requestAnimationFrame(step)})(t0);
}
function initPanZoom(svg){
  const pts=new Map();let last=null,pinch=0,moved=0;
  svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.2:1/1.2)},{passive:false});
  svg.addEventListener('pointerdown',e=>{if(e.button&&e.button!==0)return;pts.set(e.pointerId,[e.clientX,e.clientY]);moved=0;dragged=false;last=[e.clientX,e.clientY];
    if(pts.size===2){const [a,b]=[...pts.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1])}});
  window.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch){zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,d/pinch)}pinch=d;dragged=true;return}
    const r=$('mapBox').getBoundingClientRect(),dx=e.clientX-last[0],dy=e.clientY-last[1];moved+=Math.abs(dx)+Math.abs(dy);last=[e.clientX,e.clientY];
    if(moved>6){dragged=true;$('mapBox').classList.add('drag');V.x-=dx/r.width*V.w;V.y-=dy/r.height*V.h;applyV()}});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=0;if(!pts.size)$('mapBox').classList.remove('drag');if(pts.size===1)last=[...pts.values()][0]};
  window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}

/* ================== 루프 ================== */
function tick(dt){
  if(paused||!S.started||S.over)return;
  dt*=S.speed;S.t+=dt;clockTick(dt);
  for(const k in S.buffs)S.buffs[k]=Math.max(0,S.buffs[k]-dt);
  const mg={dump:2,std:1,mono:0.5}[S.mode];
  IDS.forEach(id=>{const r=S.reg[id];if(r.c>0&&r.c<100){let g=0.55/r.res*mg;const R=S.riv[REG[id].rv];if(S.shops[id])g*=1+0.25*(S.shops[id].stage+1);if(S.bGrow&&S.bGrow.until>S.clock)g*=1+S.bGrow.p/100;if(R.gone)g*=1.8;else if(R.hp<30)g*=1.4;if(S.buffs.grow>0)g*=1.5;r.c=Math.min(100,r.c+g*dt)}});
  IDS.forEach(id=>{if(S.reg[id].c>=40)ADJ[id].forEach(n=>{if(S.reg[n].c<3){const was=S.reg[n].c;S.reg[n].c+=0.3*dt;if(was<=0&&S.reg[n].c>0)news(`🌱 입소문이 퍼져 이웃 ${REG[n].n}에 자연 진출 (가게는 아직 없음)`,true)}})});
  for(const k in S.riv){const R=S.riv[k];if(R.gone)continue;
    if(S.mode==='dump'&&presence(k))R.hp-=0.5*dt;else R.hp=Math.min(100,R.hp+(k==='od'?0.3:0.15)*dt);
    R.dep=Math.max(0,R.dep-0.08*dt);if(R.hp<=0)bankrupt(k)}
  S.coins+=incomeRate()*dt;S.total+=incomeRate()*dt;checkLevel();
  addSus(((S.mode==='mono'?0.35:0)-0.22)*dt);
  S.nextBubble-=dt;if(S.nextBubble<=0){spawnBubble();S.nextBubble=rnd(2,3.5)}
  const nb=bubbles.length;bubbles=bubbles.filter(b=>S.t-b.t<8*S.speed);if(nb!==bubbles.length)drawBubbles();
  IDS.forEach(id=>{const r=S.reg[id];r.rep=Math.min(100,r.rep+0.04*dt)});
  S.nextCounter-=dt;if(S.nextCounter<=0){counter();S.nextCounter=rnd(18,28)/(1+0.25*S.prestige)}
  if(S.lvl>=6){S.nextExport-=dt;if(S.nextExport<=0){S.nextExport=rnd(18,26);const t=IDS.filter(i=>!own(i));if(t.length){const i=pick(t);S.reg[i].c=3;news(`🛳️ 수출 성공! ${REG[i].n}에 단맛제국 상륙`)}}}
  S.nextEvent-=dt;if(S.nextEvent<=0){S.nextEvent=rnd(32,48);fireEvent()}
  if(world()>=99.5)win();
}
function counter(){
  const opts=Object.keys(RIV).filter(k=>!S.riv[k].gone&&S.riv[k].hp>35&&presence(k));if(!opts.length)return;
  const rv=pick(opts),tg=IDS.filter(i=>REG[i].rv===rv&&S.reg[i].c>10&&S.reg[i].c<100);if(!tg.length)return;
  const id=pick(tg),n=(rv==='od'?10:7)+2*S.prestige;const sh=S.shops[id];if(sh&&sh.def!=null){sh.def=null;sfx('defend');news(`🛡️ ${sh.name} 방어 성공! ${RIV[rv].n}의 반격을 막았다`);return}S.reg[id].c-=n;
  news(`${RIV[rv].e} ${RIV[rv].n} 반격! ${pick(['1+1 행사','할인 쿠폰 폭탄','우리 매장 앞 전단 살포','가짜 리뷰 맞불'])}로 ${REG[id].n} −${n}%`,true);
}

function pull(n){
  if(S.tickets<n){toast('뽑기권이 모자라요 🎟️ (출석·광고·미션에서 받아요)');return}
  S.tickets-=n;S.wk.pull+=n;
  const res=[];
  for(let i=0;i<n;i++){
    S.pity10++;S.pity200++;
    let g=rollG();
    if(S.pity200>=200)g=5;else if(S.pity10>=10&&g<3)g=3;
    if(g>=3)S.pity10=0;if(g===5)S.pity200=0;
    const r=addCardTo(pick(pool(g)),g);res.push(Object.assign({g},r,{c:{...r.c}}));
    if(Math.random()<0.015){const a=unlockHidden();if(a)res.push({g:5,hidden:a})}
  }
  showReveal(res);
}

  $('revMsg').innerHTML='';R.classList.add('on');paused=true;
  const fl=[...R.querySelectorAll('.flip')];
  fl.forEach((f,i)=>setTimeout(()=>{f.classList.add('open');sfx('card_flip',0.6)},350+i*(res.length>1?220:0)));

function cardOk(c){
  const t=CT[c.tid];
  if(c.g===3&&S.lim.g3>=1){toast('보라 카드는 하루 1장만 써요');return false}
  if(c.g===4&&S.wl.g4>=2){toast('빨강 카드는 일주일 2장만 써요');return false}
  if(c.g===5&&S.wl.g5>=1){toast('유니크는 일주일 1장만 써요');return false}
  if(t.ty==='sch'&&S.lim.sch>=5){toast('오늘 공작 카드는 5번 다 썼어요');return false}
  if(t.ty==='buf'&&S.lim.buf>=3){toast('오늘 버프 카드는 3번 다 썼어요');return false}
  if(t.ty==='def'&&S.lim.def>=3){toast('오늘 방어 카드는 3번 다 썼어요');return false}
  return true;
}
function spendCard(c){
  const t=CT[c.tid];
  if(c.g===3)S.lim.g3++;if(c.g===4)S.wl.g4++;if(c.g===5)S.wl.g5++;
  if(t.ty==='sch'){S.lim.sch++;S.wk.sch++}if(t.ty==='buf')S.lim.buf++;if(t.ty==='def')S.lim.def++;
  c.qty=(c.qty||1)-1;if(c.qty<=0)S.inv=S.inv.filter(x=>x!==c);
  sfx('card_use');
}
function openCard(uid){
  const c=S.inv.find(x=>x.uid===uid);if(!c)return;const t=CT[c.tid];
  const p=Math.round(pct(c));

    }else{

        if(c.eq!=='shop:'+id)ch.push({t:`🏪 ${esc(sh.name)} 에 배치`,s:`${t.slot==='chef'?'셰프':'직원'} 칸 ${used}/${cap}`,fn:()=>{if(used>=cap){toast('칸이 꽉 찼어요. 가게를 키우면 칸이 늘어요');return}c.eq='shop:'+id;sfx('furn_place');closeModal()}})});
      if(c.tid==='legend'&&c.eq)ch.push({t:'🔥 손맛 발동 (3시간 300%)',s:S.legendDay===gday()?'오늘은 이미 썼어요':'하루 1번',fn:()=>{if(S.legendDay===gday()){toast('내일 다시 쓸 수 있어요');return}S.legendDay=gday();S.legendT=S.clock+3*HOUR;sfx('card_unique');closeModal();news('👵 할머니 손맛 발동! 손님 줄이 건물을 세 바퀴 돌았다')}});
    }
  }else if(t.ty==='sch'){
    ch.push({t:`🗺️ 지도 지역에 쓰기`,s:S.sel?`대상: ${REG[S.sel].n}`:'지도에서 지역을 먼저 탭하세요',fn:()=>useSchCard(c,'reg')});
    if(S.land&&S.landSel&&S.land.rooms[S.landSel].o!==-1&&S.land.rooms[S.landSel].o!=='me')ch.push({t:`🏢 랜드마크 ${S.landSel}호에 쓰기`,s:`평판 −${Math.round(p*2)}`,fn:()=>useSchCard(c,'land')});
  }else if(t.ty==='buf'){
    ch.push({t:'✨ 지금 쓰기',fn:()=>{if(!cardOk(c))return;spendCard(c);
      if(c.tid==='coffee')S.bInc={p,until:S.clock+3*HOUR};
      if(c.tid==='viral')S.bGrow={p:p*3,until:S.clock+3*HOUR};
      if(c.tid==='hush')addSus(-Math.round(p*1.5));
      closeModal();toast(t.e+' '+t.n+' 사용!')}});
  }else if(t.ty==='def'){
    Object.keys(S.shops).forEach(id=>{const sh=S.shops[id];ch.push({t:`🏪 ${esc(sh.name)} 지키기`,s:sh.def!=null?'이미 방어 중 (가게당 1장)':'경쟁사 반격 1번 막음',fn:()=>{if(sh.def!=null){toast('이 가게는 이미 방어 중이에요');return}if(!cardOk(c))return;spendCard(c);sh.def=c.g;if(c.tid==='lawyer')addSus(-5);sfx('defend');closeModal()}})});

function useSchCard(c,where){
  const t=CT[c.tid],p=pct(c);
  if(where==='reg'){
    if(!S.started){toast('먼저 1호점을 내세요');return}
    if(!S.sel){toast('지도에서 지역을 먼저 탭하세요 👆');return}
    const k='r'+S.sel;if((S.lim.tg[k]||0)>=2){toast('같은 대상엔 하루 2번까지예요');return}
    if(!cardOk(c))return;spendCard(c);S.lim.tg[k]=(S.lim.tg[k]||0)+1;
    const id=S.sel,rv=REG[id].rv;
    if(c.tid==='shadow'){addC(id,30);hurt(rv,30)}
    else if(c.tid==='critic'){S.reg[id].res=Math.max(0.5,S.reg[id].res*(1-p/100));addC(id,p)}
    else if(c.tid==='tears'){addC(id,p);addSus(-Math.round(p/2))}
    else{addC(id,p);if(c.tid==='review')hurt(rv,p);else lowerRep(id,c.tid==='actor'?p*1.5:p)}
    if(c.tid!=='tears'&&c.tid!=='shadow')addSus(Math.max(1,Math.round(c.g/2)));
  }else{
    const r=S.land.rooms[S.landSel];const k='L'+S.landSel;if((S.lim.tg[k]||0)>=2){toast('같은 대상엔 하루 2번까지예요');return}
    if(!landAttackable(S.landSel,true))return;
    if(!cardOk(c))return;spendCard(c);S.lim.tg[k]=(S.lim.tg[k]||0)+1;
    hitRoom(S.landSel,Math.round(p*2),t.e+' '+t.n);
  }
  closeModal();
}

function newShop(id){
  const n=Object.keys(S.shops).length+1;
  S.shops[id]={id,name:`단맛 ${REG[id].n}점`,stage:0,rep:100,furn:[],def:null,vipT:0,since:gday()};
  if(n===1)shopSel=id;

  if(id==='K'||id==='I')giveTitle('할랄 존중 셰프');

function giveTitle(t){if(S.titles.includes(t))return;S.titles.push(t);sfx('level_up',0.6);toast(`🏅 칭호 획득: ${t}`);news(`회장님이 칭호 「${t}」 를 얻었다`)}
function occ(sh){const st=STAGES[sh.stage],m=Array(st.gw*st.gh).fill(-1);sh.furn.forEach((p,i)=>{const f=FURN[p.f];for(let dy=0;dy<f.h;dy++)for(let dx=0;dx<f.w;dx++){const x=p.x+dx,y=p.y+dy;if(x<st.gw&&y<st.gh)m[y*st.gw+x]=i}});return m}
function amb(sh){return sh.furn.reduce((a,p)=>a+FURN[p.f].a,0)}
function sets(sh){return Object.keys(THEMES_F).filter(th=>{const need=Object.keys(FURN).filter(k=>FURN[k].th===th);return need.every(k=>sh.furn.some(p=>p.f===k))})}
function staffOf(id){return S.inv.filter(c=>c.eq==='shop:'+id)}
function titleBuff(){const b=TITLES[S.title]||0;return S.showT>S.clock?b*2:b}
function shopMul(id){
  const sh=S.shops[id];let m=0.5+0.5*sh.rep/100;
  m*=1+Math.min(60,amb(sh))/100;
  m*=1+0.1*sets(sh).length;
  m*=1+staffOf(id).reduce((a,c)=>a+pct(c),0)/100;
  m*=1+titleBuff()/100;
  if(S.showT>S.clock)m*=1.1;
  if(rushOn())m*=2;
  if(S.bInc&&S.bInc.until>S.clock)m*=1+S.bInc.p/100;
  if(sh.vipT>S.clock)m*=1.2;
  if(S.legendT>S.clock&&staffOf(id).some(c=>c.tid==='legend'))m*=3;
  m*=1+0.1*S.prestige;
  return m;
}
const shopRate=id=>STAGES[S.shops[id].stage].base*shopMul(id)*(S.reg[id].c>0?1:0.5);
const shopIncome=()=>Object.keys(S.shops).reduce((a,id)=>a+shopRate(id),0);

const FLOORS=[null,{n:'분식 거리',e:'🍢'},{n:'한식 골목',e:'🍚'},{n:'양식 테라스',e:'🍝'},{n:'중식 홀',e:'🥟'},{n:'파인다이닝 라운지',e:'🥂'}];

const BOTS=[
 {n:'마라대장',g:'red'},{n:'짜장백작',g:'red'},{n:'훠궈여왕',g:'red'},{n:'딤섬도사',g:'red'},{n:'탕수장군',g:'red'},
 {n:'국자공주',g:'gold'},{n:'육수왕',g:'gold'},{n:'비빔장인',g:'gold'},{n:'떡볶이킹',g:'gold'},
 {n:'혼밥요정',g:'solo'},{n:'라멘무사',g:'solo'},{n:'타코선생',g:'solo'},{n:'피자마왕',g:'solo'},{n:'커리법사',g:'solo'}];

const RID=[];for(let f=1;f<=5;f++)for(let i=1;i<=10;i++)RID.push(f*100+i);
const szOf=(f,i)=>f===5&&(i===5||i===6)?3:(i===1||i===10)?2:(i%3===0?1:0);

function initLand(){

  const put=(id,o,main)=>Object.assign(rooms[id],{o,main:!!main,rep:Math.round(rnd(65,100)),menu:SZ[rooms[id].sz].menu,chef:true,since:1});
  [401,402,403,404,405,406,407,408,409,410].forEach((id,k)=>put(id,Math.floor(k/2),k%2===0)); // 4층 붉은솥 독점
  put(202,5,1);put(203,5);put(206,6,1);put(207,6);put(302,7,1);put(303,7);put(308,8,1);
  put(105,9,1);put(109,10,1);put(305,11,1);put(503,12,1);put(508,13,1);
  S.land={rooms,log:[],loss:{},mono:{},bids:{},gob:null,gobPlan:[],newbieUntil:0,noExpandUntil:0,scouted:{}};
  rollEffects();planGoblins();
  landLog('🏢 랜드마크 빌딩이 열렸다! 4층은 붉은솥 길드가 통째로 차지하고 있다…');

function landLog(t,alarm){S.land.log.unshift(`<b>${clockStr()}</b> ${t}`);S.land.log=S.land.log.slice(0,40);if(alarm){navAlert('land',true);haltN++}}
function nbr(id){const f=Math.floor(id/100),i=id%100,a=[];if(i>1)a.push(id-1);if(i<10)a.push(id+1);if(f>1)a.push(id-100);if(f<5)a.push(id+100);return a}
const myRooms=()=>RID.filter(id=>S.land.rooms[id].o==='me');
const roomsOf=o=>RID.filter(id=>S.land.rooms[id].o===o);
const operating=r=>r.menu>0&&r.chef&&r.shell<3;
function connected(){
  const R=S.land.rooms,seen=new Set(),q=RID.filter(id=>R[id].o==='me'&&(R[id].main||R[id].branch));
  q.forEach(id=>seen.add(id));
  while(q.length){const id=q.shift();nbr(id).forEach(n=>{if(R[n].o==='me'&&!seen.has(n)){seen.add(n);q.push(n)}})}
  return seen;
}
function mgrCap(){return Math.min(2,S.inv.filter(c=>c.eq==='land'&&c.tid==='manager').reduce((a,c)=>a+(c.g>=4?2:1),0))}
const branches=()=>myRooms().filter(id=>S.land.rooms[id].branch).length;
const hasIron=()=>S.inv.some(c=>c.eq==='land'&&c.tid==='ironmgr');
function floorShare(f){const cnt={};for(let i=1;i<=10;i++){const g=gOf(S.land.rooms[f*100+i].o);if(g&&g!=='solo')cnt[g]=(cnt[g]||0)+1}let best=null,n=0;for(const g in cnt)if(cnt[g]>n){n=cnt[g];best=g}return{g:best,p:n/10}}
function monoOf(id){const f=Math.floor(id/100),m=S.land.mono[f];const g=gOf(S.land.rooms[id].o);if(!m||m.g!==g)return 0;return m.p>=1&&m.d>=1?3:m.p>=0.9&&m.d>=1?2:m.p>=0.7?1:0}
function apCost(k,target){let c=AP_COST[k];if(target&&monoOf(target)>=2&&['rep','actor','staff','chef','take'].includes(k))c=Math.ceil(c/2);return c}
function useAP(n){if(S.ap<n){toast(`행동력(AP)이 모자라요 ⚡ ${S.ap}/${n}`);return false}S.ap-=n;return true}
function roomRate(id){
  const r=S.land.rooms[id];if(r.o!=='me')return 0;
  let m=SZ[r.sz].m*(0.5+0.5*r.rep/100)*(1+r.eff.reduce((a,e)=>a+e.p,0)/100);
  if(!operating(r))m*=0.3;if(r.cutUntil)m*=0.5;if(r.bonusT>S.clock)m*=1.1;
  const mo=monoOf(id);if(mo===1)m*=0.8;if(mo>=2)m*=0.7;
  return 40/DAY*m;
}
const landRate=()=>myRooms().reduce((a,id)=>a+roomRate(id),0);
const opCost=()=>{const n=myRooms().length;return 2*n*n+30*branches()};
function rollEffects(){RID.forEach(id=>{const r=S.land.rooms[id],x=Math.random()*100,n=x<30?0:x<70?1:x<92?2:3;r.eff=[];for(let k=0;k<n;k++){const e=pick(EFX);r.eff.push({e:e.e,n:e.n,p:Math.round(rnd(1,SZ[r.sz].mx/n+1))})}let s=r.eff.reduce((a,e)=>a+e.p,0);while(s>SZ[r.sz].mx&&r.eff.length){r.eff[0].p--;s--;if(r.eff[0].p<=0)r.eff.shift()}})}
function planGoblins(){const n=2+Math.floor(Math.random()*3);S.land.gobPlan=Array.from({length:n},()=>Math.floor(rnd(9,22))).sort((a,b)=>a-b)}
function landAttackable(id,quiet){
  const r=S.land.rooms[id],say=t=>{if(!quiet||1)toast(t);return false};
  if(r.o===-1||r.o==='me')return say('공격할 수 없는 방이에요');
  if(!myRooms().some(m=>nbr(m).includes(id)))return say('내 가게와 붙어 있는 방만 공격할 수 있어요');
  if(r.prot>S.clock)return say(`보호 중이에요 🛡 (${left(r.prot)} 남음)`);
  if((S.land.loss[r.o]||0)>=2)return say('이 점주는 오늘 이미 2번 빼앗겼어요 (약자 보호)');
  return true;
}

function landAct(k){
  const id=landSelLocal,r=S.land.rooms[id];if(!id)return;
  const c=apCost(k,id);
  if(k==='open'){ // 본점 개업

  }else if(k==='empty'){

    if(r.sz>=2&&S.myeong<1){toast('대·특대 방은 「명당 카드」가 필요해요');return}
    const lc=40*(r.sz+1);if(S.lc<lc){toast(`땅코인이 모자라요 🪙${lc}`);return}
    if(!useAP(c))return;S.lc-=lc;if(r.sz>=2)S.myeong--;
    Object.assign(r,{o:'me',main:false,branch:false,rep:100,menu:1,chef:true,since:gday(),prot:S.clock+2*HOUR});sfx('build');landLog(`🏗️ ${id}호로 가게를 넓혔다`);

function landHour(h){

    if(!r.cutUntil){const days=gday()-r.since,hrs=days<2?6:days<5?12:24;r.cutUntil=S.clock+hrs*HOUR;r.prot=Math.max(r.prot,r.cutUntil);landLog(`⚠️ ${id}호가 본점과 끊겼다! ${hrs}시간 안에 다시 이어야 함 (수입 50%)`,true);sfx('alert_attack')}
    else if(r.cutUntil<=S.clock){Object.assign(r,{o:-1,menu:0,chef:false,cutUntil:0,rep:100});landLog(`💔 끊긴 ${id}호를 결국 잃었다`,true)}});

  // 봇 행동
  BOTS.forEach((b,bi)=>{
    if(Math.random()>0.33)return;
    const mine=roomsOf(bi);if(!mine.length){const e=RID.filter(id=>R[id].o===-1&&!R[id].auc&&R[id].sz<2);if(e.length&&Math.random()<0.3){const id=pick(e);Object.assign(R[id],{o:bi,main:true,rep:90,menu:SZ[R[id].sz].menu,chef:true,since:gday()});landLog(`${b.n}(${GUILD[b.g].n})이(가) ${id}호에 새로 개업`)}return}
    const adj=[...new Set(mine.flatMap(nbr))];
    const empty=adj.filter(id=>R[id].o===-1&&!R[id].auc&&R[id].sz<2);
    const prey=adj.filter(id=>R[id].o==='me'&&R[id].prot<=S.clock&&!R[id].cutUntil);
    if(prey.length&&Math.random()<0.55&&S.land.newbieUntil<=S.clock&&(L.loss.me||0)<2){
      const id=pick(prey),r=R[id];
      if(hasIron()&&Math.random()<0.4){sfx('defend');landLog(`🛡️ 철벽 점장이 ${b.n}의 공격을 막았다! (${id}호)`);r.prot=S.clock+2*HOUR;return}
      const d=Math.round(rnd(15,30));r.rep=Math.max(0,r.rep-d);r.prot=S.clock+2*HOUR;
      sfx('alert_attack');
      if(r.rep<=0&&!(r.main&&operating(r))){L.loss.me=(L.loss.me||0)+1;Object.assign(R[id],{o:bi,main:false,branch:false,rep:60,since:gday()});landLog(`🚨 ${b.n}이(가) 우리 ${id}호를 빼앗아 갔다!`,true);setTimeout(()=>sfx('voice_attack',1),300)}
      else landLog(`🚨 ${b.n}이(가) ${id}호를 공격! 평판 −${d} (남은 ${Math.round(r.rep)})`,true);
    }else if(empty.length&&mine.length<7){const id=pick(empty);Object.assign(R[id],{o:bi,main:false,rep:80,menu:SZ[R[id].sz].menu,chef:true,since:gday()});landLog(`${b.n}(${GUILD[b.g].n})이(가) ${id}호로 넓혔다`)}
  });

  L.loss={};rollEffects();planGoblins();L.scouted={};
}

function attReward(n){
  if(n===7)return{card:2,t:'🎴 파랑 카드 확정'};
  if(n===14)return{card:3,t:'🎴 보라 카드 확정'};
  if(n===21)return{card:3,cards:2,t:'🎴 보라 카드 2장'};
  if(n===28)return{card:4,hid:1,t:'🎴 빨강 카드 + 🐾 히든 동물'};
  if(n%7===3)return{gold:5,t:'🪙 골드 5'};
  if(n%2)return{tk:1,t:'🎟️ 뽑기권 1'};
  return{coin:300*n,t:'💰 '+fmt(300*n)};
}

  else{toast(`📅 출석 ${S.att.n}일째: ${r.t}`);renderPage()}
}

/* ===================== 시계 ===================== */
function clockTick(dt){
  S.clock+=dt;
  const d=gday();while(S.day<d){S.day++;onNewDay()}
  const hh=Math.floor(S.clock/HOUR);if(hh!==S.lastHour){S.lastHour=hh;onHour(ghour())}
  S.apAcc+=dt;if(S.apAcc>=3*HOUR){S.apAcc-=3*HOUR;if(S.ap<12){S.ap=Math.min(12,S.ap+3);if(S.land)sfx('ap_gain',0.4)}}
  const inc=shopIncome()*dt;S.coins+=inc;S.total+=inc;S.incDay+=inc+incomeRate()*dt;
  for(const id in S.shops){const sh=S.shops[id];sh.rep=Math.max(0,sh.rep-dt*(15/DAY))}
  if(S.land)landTick(dt);
  if(S.vip&&S.vip.until<=S.clock){news(`VIP ${S.vip.v.n} 손님이 기다리다 돌아갔다 😢`);S.vip=null;navAlert('shop',false)}
  landUnlock();
}
function onHour(h){
  if(S.vipPlan.includes(Math.floor(h))){S.vipPlan=S.vipPlan.filter(x=>x!==Math.floor(h));spawnVip()}
  if(Math.floor(h)===11||Math.floor(h)===18){sfx('rush',0.7);news('🍱 러시 타임 시작! 지도 위 버튼을 눌러 손님 2배 받기',true);if(Object.keys(S.shops).length)haltN++}
  if(S.land)landHour(h);
}
function onNewDay(){
  S.lim={sch:0,buf:0,def:0,g3:0,tg:{}};S.ads=0;S.apEx=0;
  S.incHist.push(Math.round(S.incDay));S.incHist=S.incHist.slice(-7);S.incDay=0;
  const n=Object.keys(S.shops).length;S.vipPlan=n?Array.from({length:1+(Math.random()<0.5?1:0)},()=>Math.floor(rnd(10,21))):[];
  if((S.day-1)%7===0){ // 월요일 = 주간 초기화
    const avg=S.incHist.reduce((a,b)=>a+b,0)/Math.max(1,S.incHist.length);
    let p=Math.max(20,Math.round(avg*0.2/100));
    p=Math.round(p*(S.wl.gold>100?1.1:S.wl.gold<30?0.9:1));
    p=Math.min(Math.round(S.goldP*1.15),Math.max(Math.round(S.goldP*0.85),p));S.goldP=Math.max(20,p);
    S.wl={g4:0,g5:0,box:0,gold:0};S.wk={sch:0,pull:0,up:0,vip:0,atk:0,att:0};S.wkGot={};
    news(`📊 새 주가 시작됐다! 이번 주 골드 시세 💰${fmt(S.goldP)}`);
  }
  if(S.land)landDay();
  if(S.att.last!==gday())navAlert('daily',true);
  if(S.farms>=5)giveTitle('설탕왕');
  toast(`🌅 ${S.day}일째 아침`);
}

function charSvgFor(key){
  if(key.startsWith('hidden_')){const id=key.slice(7);if(!ANIMALS[id])return null;return drawChar(LK({sp:id,eye:'round',mouth:'smile',fit:'suit',fcol:'navy',bg:'lav'}),'full')}
  const m=CHARMAP[key];if(!m)return null;return drawChar(lookOf(m[0]),m[1]?'bust':'full');
}

/* ===== 꾸미기 화면 ===== */
let styleSel='boss';
function setLook(k,v){LOOKS[styleSel]=Object.assign({},LOOKS[styleSel]||{},{[k]:v});saveLooks();sfx('furn_place',0.5);afterLook()}
function afterLook(){renderPage.last='';renderPage();$('secArt').innerHTML=art('secretary','👩‍💼')}
function randLook(){const L={};OPTS.forEach(([k,,ops])=>{if(ops)L[k]=pick(ops)[0]});L.sp='human';L.pet='no';if(S.hidden.length&&Math.random()<0.3)L.sp=pick(S.hidden);if(S.hidden.length&&Math.random()<0.4)L.pet=pick(S.hidden);LOOKS[styleSel]=L;saveLooks();sfx('card_flip');afterLook()}
function resetLook(){delete LOOKS[styleSel];saveLooks();afterLook()}
function renderStyle(){
  const L=lookOf(styleSel),grps=[...new Set(Object.values(CHARS).map(c=>c.grp))];
  const row=(k,n,ops)=>{
    if(k==='sp')ops=[['human','사람'],...AIDS.map(a=>[a,ANIMALS[a].n])];
    if(k==='pet')ops=[['no','없음'],...AIDS.map(a=>[a,ANIMALS[a].n])];
    const human=L.sp==='human';
    if(!human&&['skin','hair','hc'].includes(k))return '';
    return `<div style="margin-bottom:9px"><div class="mute" style="font-size:12px;margin-bottom:4px">${n}</div><div class="row" style="gap:5px">${ops.map(([v,t])=>{
      const locked=(k==='sp'||k==='pet')&&v!=='human'&&v!=='no'&&!ownA(v);
      const sw=k==='skin'?SKIN[v]:k==='hc'?HC[v]:k==='fcol'?FCOL[v]:k==='bg'?(BGC[v]||'transparent'):'';
      return `<button class="btn" style="padding:5px 9px;font-size:12.5px;${L[k]===v?'border-color:var(--gold);color:var(--gold)':''}${locked?';opacity:.4':''}" ${locked?'disabled':''} onclick="setLook('${k}','${v}')">${sw?`<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${sw};border:1px solid #0006;vertical-align:-1px;margin-right:4px"></span>`:''}${locked?'🔒 ???':t}</button>`}).join('')}</div></div>`};
  const dex=AIDS.map(a=>{const o=ownA(a),A=ANIMALS[a];return `<div class="gc g${o?A.g:0}" style="${o?'':'opacity:.5'}">${o?art('hidden_'+a,'🐾'):'<div class="art" style="aspect-ratio:3/4;border-radius:8px;margin-bottom:4px"><span style="font-size:30px">❔</span></div>'}<b>${o?A.n:'???'}</b><span class="tag gr${A.g}">${GR[A.g].n}</span></div>`}).join('');
  return `<div class="ph1"><h2>👗 꾸미기</h2><small>지금은 모두 무료 · 히든 동물 ${S.hidden.length}/${AIDS.length}</small></div>
  ${grps.map(g=>`<div class="seg" style="margin-bottom:6px"><span style="font-size:11px;color:var(--mute);padding:8px 4px;white-space:nowrap">${g}</span>${Object.keys(CHARS).filter(id=>CHARS[id].grp===g).map(id=>`<button class="${styleSel===id?'on':''}" onclick="styleSel='${id}';renderPage()">${CHARS[id].n}</button>`).join('')}</div>`).join('')}
  <div class="box"><div class="row" style="align-items:flex-start;gap:14px">
   <div style="flex:0 0 min(240px,42vw)"><div class="art" style="width:100%;aspect-ratio:320/380;border-radius:14px;background:transparent">${drawChar(L,'full')}</div>
    <div class="row" style="margin-top:8px;gap:6px"><button class="btn pur" onclick="randLook()">🎲 랜덤</button><button class="btn" onclick="resetLook()">↩ 기본</button></div></div>
   <div class="grow" style="min-width:220px">${OPTS.map(([k,n,ops])=>row(k,n,ops)).join('')}</div>
  </div></div>
  <div class="box"><h3>🐾 히든 동물 도감</h3><div class="mute" style="font-size:12px;margin-bottom:8px">카드 뽑기 때 아주 가끔(한 번에 1.5%) 나타나요. 28일 출석 보상에도 하나. 얻은 동물은 「종족」으로 캐릭터 얼굴을 바꾸거나 「펫」으로 데리고 다닐 수 있어요.</div><div class="inv">${dex}</div></div>
  <div class="box mute" style="font-size:12px">그림으로 바꾸려면 <b>img/parts/</b>에 부품 그림(예: hat_crown.png)을, 캐릭터 통째는 <b>img/</b>에(예: secretary.png, hidden_fox.png) 넣으면 자동으로 바뀌어요.</div>`;
}
function unlockHidden(){const left=AIDS.filter(a=>!S.hidden.includes(a));if(!left.length)return null;const a=pick(left);S.hidden.push(a);return a}
function hiddenCard(a){const A=ANIMALS[a];return `<div class="gc g5">${art('hidden_'+a,'🐾')}<b>히든: ${A.n}</b><span class="tag gr5">히든 동물</span></div>`}

function titleScreen(){document.addEventListener('pointerdown',function f(){if(!S||!S.started)bgm('bgm_title');document.removeEventListener('pointerdown',f)});
  const sv=load();
  $('title').innerHTML=art('title','🍔')+`<h1>세계 음식 <em>정복</em> <small style="font-size:14px;color:var(--mute)">2판</small></h1>
   <p>설탕 노점에서 시작해 전 세계 식탁을 내 것으로.<br>가게를 키우고, 카드를 모으고, 랜드마크 자리를 빼앗아라.<br>시간은 <b>⏭ 버튼을 눌러야만</b> 흘러요. 천천히 생각하세요.<br>단, <b style="color:#ff8a8a">의심도 100%</b>면 끝!</p>
   <button class="choice primary" id="newG">🚩 새 게임</button>${sv?'<button class="choice" id="contG">▶ 이어하기 (Lv.'+sv.lvl+' · D'+(sv.day||1)+')</button>':''}
   <div class="mute" style="font-size:12px;margin-top:14px">화면 색 고르기</div>${themeBtns()}`;
  $('newG').onclick=()=>{S=fresh();start()};
  if(sv)$('contG').onclick=()=>{S=Object.assign(fresh(),sv);S.speed=1;start()};
}
function start(){
  $('title').style.display='none';fitMap();if(S.sel)focusRegion(S.sel,fitW()/2);
  $('secArt').innerHTML=art('secretary','👩‍💼');
  if(S.att.last!==gday())navAlert('daily',true);
  render();suggest(true);
  if(!S.started)news('단맛제국 회장, 복수를 다짐하며 지도를 펼치다');
}
try{setTheme(localStorage.getItem('wfc_theme')||'night')}catch(e){}
buildMap();
window.addEventListener('resize',applyV);
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));
document.querySelectorAll('#sheetTabs button').forEach(b=>b.onclick=()=>{openSheet.keep=1;openSheet(b.dataset.t);openSheet.keep=0});
$('sheetX').onclick=closeSheet;
$('snd').textContent=muted?'🔇':'🔊';$('snd').onclick=toggleMute;
$('gear').onclick=()=>{if(S)settings()};
$('rushBtn').onclick=()=>{if(!rushWin())return;S.rushClaim=rushKey();sfx('rush');floatTxt('🍱 손님 2배!','#ffb347');news('🍱 러시 타임! 모든 가게 손님 2배');render()};
let ptrDown=false;window.addEventListener('pointerdown',()=>ptrDown=true,true);window.addEventListener('pointerup',()=>setTimeout(()=>ptrDown=false,300),true);window.addEventListener('pointercancel',()=>ptrDown=false,true);
let last=performance.now(),acc=0,sheetAcc=0,pageAcc=0;
setInterval(()=>{const now=performance.now(),dt=Math.min(0.5,(now-last)/1000);last=now;if(!S||document.hidden)return;
  if(S.started&&!paused)landUnlock();render();suggest(false);
  if(S.started&&!S.over){bgm(S.sus>=70?'bgm_tension':curPage==='land'?'bgm_landmark':curPage==='shop'?'bgm_shop':'bgm_main');if(S.sus>=75&&!warned){warned=true;sfx('voice_warning',1)}if(S.sus<60)warned=false}
  acc+=dt;if(acc>5){acc=0;save()}
  pageAcc+=dt;if(curPage!=='map'&&pageAcc>1&&!paused&&!ptrDown){pageAcc=0;const a=document.activeElement;if(!a||a.tagName!=='INPUT')renderPage()}
  sheetAcc+=dt;if(sheetTab&&sheetAcc>1){sheetAcc=0;document.querySelectorAll('#sheetBody .card').forEach(b=>{const c=C.find(x=>x.id===b.dataset.id);b.classList.toggle('poor',S.lvl>=c.lv&&S.coins<cardCost(c))})}
},200);
probeParts();titleScreen();
/* ===== 시간 진행: 버튼을 눌러야만 흐름 ===== */
let advancing=false;
function advance(h){
  if(!S||!S.started||S.over||paused||advancing)return;
  const total=h==='morning'?(DAY-((S.clock+9*HOUR)%DAY)+9*HOUR):h*HOUR;
  advancing=true;$('adv').classList.add('busy');sfx('tap',0.5);S.speed=1;
  let done=0;const h0=haltN,lv0=S.lvl;
  const stop=()=>paused||haltN!==h0||S.over||!S.started;
  (function frame(){
    for(let n=0;n<10&&done<total;n++){const d=Math.min(0.25,total-done);tick(d);done+=d;if(stop())break}
    render();drawBubbles();
    if(done<total-0.001&&!stop())requestAnimationFrame(frame);
    else{advancing=false;$('adv').classList.remove('busy');if(done<total-0.001&&!S.over&&S.started)toast('⏸ 일이 생겨서 멈췄어요. 확인하고 다시 눌러 주세요');after();save()}
  })();
}
/* ===== 안드로이드 앱용 (뒤로 가기 · 앱 내려갈 때) ===== */
window.onAndroidBack=function(){
  if($('reveal').classList.contains('on')){$('revOk').click();return true}
  if($('modal').classList.contains('open')){const c=[...document.querySelectorAll('#mBox .choice')].find(b=>/취소|닫기|나중에|다른 곳/.test(b.textContent));if(c)c.click();return true}
  if(sheetTab){closeSheet();return true}
  if(S&&curPage!=='map'){go('map');return true}
  return false;
};
window.onAppPause=function(){try{save()}catch(e){}if(bgmEl)bgmEl.pause()};
window.onAppResume=function(){if(bgmEl&&!muted)bgmEl.play().catch(()=>{})};
