name: APK 만들기

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK 빌드
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 이름 붙이기
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/WorldFood-$(date +%Y%m%d-%H%M).apk"

      - uses: actions/upload-artifact@v4
        with:
          name: WorldFood-apk
          path: out/*.apk
